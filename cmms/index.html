m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.cmms-preview-btn,.cmms-save-disabled{padding:10px 14px;border-radius:8px;font-size:11px;font-weight:800}.cmms-preview-btn{background:#176B73;color:#fff}.cmms-save-disabled{background:#E9EDF1;color:#87939E;cursor:not-allowed}.cmms-asset-preview{display:none;margin-top:13px;padding:12px;background:#EFF7F5;border:1px solid #CDE4DF;border-radius:9px;color:#235D59;font-size:11px;line-height:1.9}.cmms-asset-preview:not(:empty){display:block}.cmms-asset-preview>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;margin:7px 0}.cmms-asset-preview small{color:#6C8581}@media(max-width:850px){.cmms-form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.cmms-asset-preview>div{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.cmms-form-grid{grid-template-columns:1fr}.cmms-form-grid .wide{grid-column:auto}.cmms-form-head{flex-direction:column}.cmms-asset-preview>div{grid-template-columns:1fr}}.cmms-master-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin:14px 0}.cmms-master-form{min-width:0;padding:15px;border:1px solid #DCE7EC;border-radius:12px;background:#FBFCFD}.cmms-form-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.cmms-master-preview{display:none;margin-top:12px;padding:11px;border:1px solid #CDE4DF;background:#EFF7F5;border-radius:8px;color:#235D59;font-size:11px;line-height:1.9}.cmms-master-preview:not(:empty){display:block}.cmms-master-preview>div{display:grid;gap:4px;margin:6px 0}.cmms-master-preview small{color:#6C8581}.cmms-master-list{margin:18px 0}.cmms-master-list h4{font-size:13px;color:#334B5C;margin:0 0 9px}@media(max-width:900px){.cmms-master-grid{grid-template-columns:1fr}}@media(max-width:520px){.cmms-form-grid.two{grid-template-columns:1fr}}.cmms-flow h3{margin-bottom:13px}.cmms-steps{display:flex;align-items:center;gap:8px;overflow-x:auto;padding:4px 0 8px;white-space:nowrap}.cmms-steps span{background:#EEF3F8;border:1px solid #DCE5EE;border-radius:8px;padding:9px 11px;font-size:10px;color:#38536B;font-weight:700}.cmms-steps i{font-style:normal;color:#9AA8B5}

<body>
<section id="login">
 <div class="login-card">
  <div class="brand">MEHRSA • TECHNICAL OPERATIONS</div>
  <h1>تعمیرات و نگهداری مهرسا</h1>
  <p>سامانه مستقل مدیریت تجهیزات، خرابی‌ها، دستورکارهای تعمیراتی و نگهداری پیشگیرانه</p>
  <label for="auth-email">شناسه کاربری</label><input id="auth-email" autocomplete="username" placeholder="شناسه یا ایمیل">
  <label for="auth-password">رمز عبور</label><input id="auth-password" type="password" autocomplete="current-password" placeholder="رمز عبور">
  <button class="login-btn" id="login-btn" onclick="cmmsLogin()">ورود به سامانه</button>
  <div id="auth-msg">با حساب کاربری فعلی خود وارد شوید. دسترسی‌ها از پایگاه داده کنترل می‌شوند.</div>
 </div>
</section>
<div id="app">
 <header class="appbar"><div><strong>سامانه تعمیرات و نگهداری مهرسا</strong><small id="signed-user">CMMS مستقل • نسخه ۱</small></div><button class="logout" onclick="cmmsLogout()">خروج از حساب</button></header>
 <main><section id="cmms-v1-view" aria-live="polite"></section></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://jpzgtbafrpjjbtwqwzlr.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_Y_mc64kSyCr8bKpZNmUE8Q_uFbOI5m8";
let cloud=null,cloudUser=null,currentRole="",currentUser="",currentTitle="";
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function authMessage(t){const el=document.getElementById("auth-msg");if(el)el.textContent=t;}
async function ensureCloud(){if(!window.supabase?.createClient)throw new Error("کتابخانه اتصال بارگذاری نشد.");if(!cloud)cloud=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);return cloud;}
// CMMS V1 — standalone application. Mutations are performed only through authorized RPCs.
let cmmsActiveTab="overview";
let cmmsData={assets:[],locations:[],categories:[],failures:[],orders:[],pmPlans:[],pmTasks:[],assignments:[],actions:[],approvals:[],meterReadings:[],purchaseLinks:[],audit:[]};
let cmmsLoadState="idle",cmmsLoadError="",cmmsAssignedRole="",cmmsAssignedRoles=[];
async function cmmsLoadUserRole(){
  cmmsAssignedRole="";
  cmmsAssignedRoles=[];
  if(!cloudUser)return;
  const {data,error}=await cloud.from("cmms_user_roles")
    .select("role,location_id")
    .eq("user_id",cloudUser.id)
    .eq("is_active",true);
  if(error)throw new Error("خطا در دریافت سطح دسترسی CMMS: "+error.message);
  cmmsAssignedRoles=[...new Set((data||[]).map(x=>x.role).filter(Boolean))];
  const precedence=["responsible_manager","technical_supervisor","technical_expert","technician"];
  cmmsAssignedRole=precedence.find(role=>cmmsAssignedRoles.includes(role))||"";
}
function cmmsCanAccess(){
  return !!cloudUser && ["technical_supervisor","responsible_manager","technical_expert","technician"].includes(cmmsAssignedRole);
}
function cmmsRoleLabel(){
  const labels={technical_supervisor:"سرپرست فنی — تأیید فنی مرحله اول",responsible_manager:"مدیر مسئول — تأیید نهایی همه تجهیزات",technical_expert:"کارشناس فنی",technician:"تکنسین تعمیرات"};
  const ordered=["responsible_manager","technical_supervisor","technical_expert","technician"].filter(role=>cmmsAssignedRoles.includes(role));
  return ordered.map(role=>labels[role]).join(" / ")||"بدون دسترسی CMMS";
}
function cmmsSetTab(tab){cmmsActiveTab=tab;renderCMMSView();}
function cmmsText(v){return v===null||v===undefined||v===""?"—":String(v);}
function cmmsDate(v){if(!v)return "—";const d=new Date(v);return Number.isNaN(d.getTime())?cmmsText(v):d.toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"});}
function cmmsStatus(v){const map={operational:"در سرویس",degraded:"دارای محدودیت",stopped:"متوقف",under_maintenance:"در تعمیر",retired:"اسقاط‌شده",submitted:"ثبت‌شده",under_review:"در بررسی",rejected:"ردشده",converted:"تبدیل به دستورکار",cancelled:"لغوشده",open:"باز",triage:"در بررسی فنی",approved_for_execution:"آماده ارجاع",assigned:"ارجاع‌شده",in_progress:"در حال اجرا",waiting_parts:"در انتظار قطعه",testing:"در مرحله آزمون",pending_supervisor_approval:"در انتظار تأیید سرپرست",pending_manager_approval:"در انتظار تأیید مدیر مسئول",rework:"نیازمند اصلاح",due:"سررسیدشده",overdue:"عقب‌افتاده",completed:"تکمیل‌شده",closed:"بسته‌شده"};return map[v]||cmmsText(v);}
function cmmsRows(key){return cmmsData[key]||[];}
async function cmmsLoadData(force=false){
  if(!cmmsCanAccess())return;
  if(cmmsLoadState==="loading")return;
  if(cmmsLoadState==="loaded"&&!force)return;
  cmmsLoadState="loading";cmmsLoadError="";renderCMMSView();
  const queries=[
    ["assets","cmms_assets"],["locations","cmms_locations"],["categories","cmms_asset_categories"],
    ["failures","cmms_failure_reports"],["orders","cmms_work_orders"],["pmPlans","cmms_pm_plans"],
    ["pmTasks","cmms_pm_tasks"],["assignments","cmms_work_order_assignments"],
    ["actions","cmms_work_order_actions"],["approvals","cmms_work_order_approvals"],
    ["meterReadings","cmms_asset_meter_readings"]
  ];
  if(["technical_supervisor","responsible_manager","technical_expert"].some(role=>cmmsAssignedRoles.includes(role))){
    queries.push(["purchaseLinks","cmms_work_order_purchase_links"]);
  }else{
    cmmsData.purchaseLinks=[];
  }
  // Audit logs are governance-only under RLS. Do not make the whole dashboard
  // fail for experts/technicians when they correctly lack audit-log access.
  if(["technical_supervisor","responsible_manager"].includes(cmmsAssignedRole)){
    queries.push(["audit","cmms_audit_logs"]);
  }else{
    cmmsData.audit=[];
  }
  if(cmmsAssignedRole==="technical_supervisor")queries.push(["userRoles","cmms_user_roles"]);
  const results=await Promise.all(queries.map(async ([key,table])=>{
    try{const {data,error}=await cloud.from(table).select("*").limit(500);if(error)throw error;return {key,data:data||[]};}
    catch(e){return {key,error:e};}
  }));
  const failed=results.filter(x=>x.error);
  results.forEach(x=>{if(x.data)cmmsData[x.key]=x.data;});
  if(failed.length){
    cmmsLoadState="error";
    cmmsLoadError=failed.map(x=>x.key+": "+(x.error.message||String(x.error))).join(" | ");
  }else cmmsLoadState="loaded";
  renderCMMSView();
}
function cmmsMetric(label,value,sub="") {
 return "<div class='cmms-metric'><small>"+escapeHtml(label)+"</small><strong>"+escapeHtml(String(value))+"</strong>"+(sub?"<em>"+escapeHtml(sub)+"</em>":"")+"</div>";
}
function cmmsTable(headers,rows,emptyText){
 if(!rows.length)return "<div class='cmms-empty'>"+escapeHtml(emptyText)+"</div>";
 return "<div class='cmms-table-wrap'><table class='cmms-table'><thead><tr>"+headers.map(h=>"<th>"+escapeHtml(h[0])+"</th>").join("")+"</tr></thead><tbody>"+rows.map(row=>"<tr>"+headers.map(h=>"<td>"+escapeHtml(cmmsText(h[1](row)))+"</td>").join("")+"</tr>").join("")+"</tbody></table></div>";
}
function cmmsAssetForm(){
 const categories=cmmsRows("categories"),locations=cmmsRows("locations").filter(x=>x.is_active!==false);
 const optionList=(items,empty)=>items.length?items.map(x=>"<option value='"+escapeHtml(x.id)+"'>"+escapeHtml((x.code?x.code+" — ":"")+x.name)+"</option>").join(""):"<option value=''>"+empty+"</option>";
 return "<form class='cmms-asset-form' id='cmms-asset-form' onsubmit='return cmmsPreviewAsset(event)'>"+
 "<div class='cmms-form-head'><div><h4>ثبت شناسنامه تجهیز</h4><p>فیلدهای ستاره‌دار الزامی هستند. ثبت اطلاعات از طریق عملیات کنترل‌شده پایگاه داده انجام می‌شود.</p></div><span>فرم آماده‌سازی</span></div>"+
 "<div class='cmms-form-grid'>"+
 "<label>کد تجهیز *<input name='asset_code' required maxlength='40' placeholder='مثلاً PUMP-001'></label>"+
 "<label>نام تجهیز *<input name='name' required maxlength='160' placeholder='مثلاً پمپ انتقال رزین'></label>"+
 "<label>دسته‌بندی<select name='category_id'><option value=''>انتخاب دسته‌بندی</option>"+optionList(categories,"دسته‌بندی تعریف نشده")+"</select></label>"+
 "<label>محل استقرار *<select name='location_id' required><option value=''>انتخاب محل</option>"+optionList(locations,"محلی تعریف نشده")+"</select></label>"+
 "<label>سازنده<input name='manufacturer' maxlength='120'></label>"+
 "<label>مدل<input name='model' maxlength='120'></label>"+
 "<label>شماره سریال<input name='serial_number' maxlength='120'></label>"+
 "<label>مسئول تجهیز<input name='equipment_owner' maxlength='120' placeholder='واحد یا مسئول بهره‌بردار'></label>"+
 "<label>اهمیت تجهیز *<select name='criticality' required><option value='medium'>متوسط</option><option value='low'>پایین</option><option value='high'>بالا</option><option value='critical'>بحرانی</option></select></label>"+
 ""+
 ""+
 ""+
 "<label class='wide'>مشخصات فنی<textarea name='technical_specs' rows='3' placeholder='توان، ظرفیت، فشار، دما، ولتاژ، جریان، ابعاد و سایر مشخصات...'></textarea></label>"+
 "</div><div class='cmms-form-actions'><button type='button' class='cmms-preview-btn' onclick='document.getElementById(&#39;cmms-asset-form&#39;).requestSubmit()'>بررسی اطلاعات</button><button type='button' class='cmms-save-btn' onclick='cmmsCreateAsset()' "+(cmmsCanCreateAsset()?"":"disabled title='فقط سرپرست فنی و کارشناس فنی مجاز به ثبت تجهیز هستند'")+">ثبت شناسنامه تجهیز</button></div>"+
 "<div id='cmms-asset-preview' class='cmms-asset-preview' aria-live='polite'></div></form>";
}
function cmmsCanCreateAsset(){return ["technical_supervisor","technical_expert"].includes(cmmsAssignedRole);}
async function cmmsCreateAsset(){
 const form=document.getElementById("cmms-asset-form");
 if(!form||!cmmsCanCreateAsset())return;
 if(!form.reportValidity())return;
 const d=Object.fromEntries(new FormData(form).entries());
 if(!d.location_id){alert("انتخاب محل استقرار الزامی است.");return;}
 const btn=form.querySelector(".cmms-save-btn");
 if(btn){btn.disabled=true;btn.textContent="در حال ثبت...";}
 try{
  const {data,error}=await cloud.rpc("cmms_create_asset",{
   p_asset_code:d.asset_code.trim(),p_name:d.name.trim(),p_location_id:d.location_id,
   p_criticality:d.criticality,p_category_id:d.category_id||null,
   p_manufacturer:d.manufacturer||null,p_model:d.model||null,
   p_serial_number:d.serial_number||null,
   p_technical_specs:{notes:d.technical_specs||""},
   p_equipment_owner:d.equipment_owner||null
  });
  if(error)throw error;
